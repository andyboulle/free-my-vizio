<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="/shared/tokens.css"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:system-ui,sans-serif;color:#fff;background:#10131a}body{overflow:hidden;padding:4% 5%;background:radial-gradient(circle at 20% 10%,color-mix(in srgb,var(--accent,#4aa8ff) 28%,transparent),transparent 55%),#10131a}h1{font-size:clamp(12px,2.4vw,25px);margin:0 0 2%}time{display:block;font-size:clamp(22px,6vw,64px);font-weight:700}#date{opacity:.7;font-size:clamp(9px,1.8vw,18px)}#rails{display:grid;gap:4%;margin-top:5%}.rail h2{font-size:clamp(9px,1.6vw,16px);margin:0 0 1%;opacity:.8}.row{display:flex;gap:2%;overflow:hidden}.tile{width:clamp(55px,13vw,135px);aspect-ratio:1.25;border:2px solid transparent;border-radius:12px;background:color-mix(in srgb,var(--accent,#4aa8ff) 22%,#202733);color:#fff;padding:6%;display:grid;place-items:center;text-align:center;font-size:clamp(8px,1.5vw,15px)}.tile.selected{border-color:var(--accent,#4aa8ff);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#4aa8ff) 25%,transparent)}.tile.hidden{opacity:.45}.tile span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}body.light{color:#17202b;background:linear-gradient(135deg,#f6f7f9,#dcecff)}body.oled{background:#000}
</style></head><body><h1 id="title">Living Room</h1><time id="clock"></time><div id="date"></div><div id="rails"></div><script>
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function render(home,selected){document.body.className=home.theme||'cinematic';document.documentElement.style.setProperty('--accent',home.accent||'#4aa8ff');document.querySelector('#title').textContent=home.title||'Living Room';document.querySelector('#clock').textContent=new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit',hour12:home.clock?.format==='12h'?true:home.clock?.format==='24h'?false:undefined}).format();document.querySelector('#date').textContent=home.clock?.showDate===false?'':new Intl.DateTimeFormat(undefined,{weekday:'long',month:'long',day:'numeric'}).format(new Date());document.querySelector('#rails').innerHTML=(home.sections||[]).map(section=>'<section class="rail"><h2>'+esc(section.title)+'</h2><div class="row">'+section.shortcuts.map(s=>'<div class="tile '+(s.hidden?'hidden ':'')+(s.id===selected?'selected':'')+'"><span>'+esc(s.label)+'</span></div>').join('')+'</div></section>').join('')}addEventListener('message',e=>{if(e.source!==parent||!e.data||e.data.type!=='fmv-preview')return;render(e.data.config.home,e.data.selected)});parent.postMessage({type:'fmv-preview-ready'},location.origin);
</script></body></html>
